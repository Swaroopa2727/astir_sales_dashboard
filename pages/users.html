<!-- ============================================================
     MAIN CONTENT
============================================================= -->
<main class="main-content">

  <div class="page-header">
    <div class="title-wrap">
      <!-- <i class="bi bi-people-fill title-icon-lg"></i> -->
      <div>
        <h5>Users</h5>
        <p>Manage system users and their access.</p>
      </div>
    </div>
    <a href="add-user.html" class="btn-add" id="addUserBtn"><i class="bi bi-plus-circle-fill"></i> Add New</a>
  </div>

  <div class="panel">
    <div class="users-filters">
      <div class="inline-group">
        <label for="companyFilter">Company</label>
        <select id="companyFilter" class="form-select form-select-sm">
          <option value="all">--All--</option>
          <option>Advent Infotech</option>
          <option>Astir</option>
        </select>
      </div>
      <div class="form-check mb-0">
        <input class="form-check-input" type="checkbox" id="includeInactive">
        <label class="form-check-label" for="includeInactive">Include InActivated Users</label>
      </div>
    </div>

    <div class="table-responsive-wrap">
      <table class="table report-table users-table mb-0">
        <thead>
          <tr>
            <th class="sortable" data-key="company">Company<i class="bi bi-arrow-down-up"></i></th>
            <th class="sortable" data-key="name">Full Name<i class="bi bi-arrow-down-up"></i></th>
            <th class="sortable" data-key="email">Email<i class="bi bi-arrow-down-up"></i></th>
            <th class="sortable" data-key="type">User Type<i class="bi bi-arrow-down-up"></i></th>
            <th class="sortable" data-key="created">Created On<i class="bi bi-arrow-down-up"></i></th>
            <th class="sortable" data-key="inactive">InActivated Date<i class="bi bi-arrow-down-up"></i></th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>

    <div class="users-table-foot">
      <span id="showingText"></span>
      <div class="pager" id="pager"></div>
    </div>
  </div>

</main>
