<main class="main-content">

  <div class="page-header">
    <div class="title-wrap">
      <!-- <i class="bi bi-bullseye title-icon-lg"></i> -->
      <div>
        <h5>Targets</h5>
        <p>Set and manage targets for your team to drive performance.</p>
      </div>
    </div>
  </div>

  <div class="panel targets-panel">
    <form class="targets-filters" id="targetsFilter">
      <div class="inline-group"><label for="salesType">Sales Type:</label>
        <select id="salesType" class="form-select form-select-sm"><option>Bench Sales</option><option>Third Party Sales</option></select></div>
      <div class="inline-group"><label for="tCompany">Company:</label>
        <select id="tCompany" class="form-select form-select-sm"><option>Astir</option><option>Advent Infotech</option></select></div>
      <div class="inline-group"><label for="tMonth">Month:</label>
        <select id="tMonth" class="form-select form-select-sm"></select></div>
      <div class="inline-group"><label for="tYear">Year:</label>
        <select id="tYear" class="form-select form-select-sm"><option>2025</option><option selected>2026</option></select></div>
      <button type="submit" class="btn-add"><i class="bi bi-funnel"></i> Filter</button>
    </form>

    <div id="saveAlert" class="alert alert-success d-none" role="alert">Targets saved successfully.</div>

    <div class="table-responsive-wrap targets-table-wrap">
      <table class="table targets-table mb-0">
        <thead>
          <tr>
            <th rowspan="2">Company</th>
            <th rowspan="2">RM Name</th>
            <th rowspan="2">Submissions Targets</th>
            <th rowspan="2">Interviews Targets</th>
            <th rowspan="2">Confirmations Targets</th>
            <th rowspan="2">Placements Targets</th>
            <th colspan="2" class="msa-head">MSA</th>
          </tr>
          <tr><th class="msa-sub">Targets</th><th class="msa-sub">Results</th></tr>
        </thead>
        <tbody id="targetsBody"></tbody>
      </table>
    </div>

    <div class="text-center mt-4">
      <button type="button" class="btn-add mx-auto" id="saveAll"><i class="bi bi-floppy"></i> Save All</button>
    </div>
  </div>

</main>
