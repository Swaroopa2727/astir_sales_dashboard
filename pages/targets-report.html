<!-- ============================================================
     MAIN CONTENT

<main class="main-content">

  <div class="page-header">
    <div>
      <h1>Targets Report</h1>
      <p>Targets versus results for each RM.</p>
    </div>
    <form class="filters-bar" id="crFilter">
      <div class="filter-group"><label for="crCompany">Company</label>
        <select id="crCompany" class="form-select form-select-sm"><option value="Astir">Astir</option><option value="Advent Infotech">Advent Infotech</option><option value="all">--All--</option></select></div>
      <div class="filter-group"><label for="crMonth">Month</label>
        <select id="crMonth" class="form-select form-select-sm"><option>July</option><option selected>August</option><option>September</option></select></div>
      <div class="filter-group"><label for="crYear">Year</label>
        <select id="crYear" class="form-select form-select-sm"><option>2025</option><option selected>2026</option></select></div>
      <button type="submit" class="btn btn-run"><i class="bi bi-play-fill"></i> Run</button>
    </form>
  </div>

  <div class="panel" id="targetsReportRoot">
    <div class="table-panel-head">
      <div class="panel-title mb-0"><span class="title-icon"><i class="bi bi-clipboard-data-fill"></i></span><span id="crTitle">Targets Report</span></div>
      <button type="button" class="btn-export" id="crExport"><i class="bi bi-file-earmark-excel-fill"></i> Export to Excel</button>
    </div>
    <div class="table-responsive-wrap client-scroll">
          <table class="table report-table targets-report-table mb-0">
            <thead>
              <tr>
                <th rowspan="2" class="left">Company</th><th rowspan="2">RM Name</th>
                <th colspan="2">Submissions</th><th colspan="2">Interviews</th><th colspan="2">Confirmations</th><th colspan="2">Placements</th><th colspan="2">MSA</th>
              </tr>
              <tr class="sub"><th>Targets</th><th>Results</th><th>Targets</th><th>Results</th><th>Targets</th><th>Results</th><th>Targets</th><th>Results</th><th>Targets</th><th>Results</th></tr>
            </thead>
            <tbody data-cr-body></tbody>
          </table>
        </div>
        <div class="users-table-foot">
          <span data-cr-showing></span>
          <div class="pager" data-cr-pager></div>
        </div>
  </div>

</main>
